<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JClip AI - Clips Automáticos con Inteligencia Artificial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-5 sm:p-6 backdrop-blur-md">
        <div id="authSection" class="space-y-4">
            <div class="text-center mb-6 pt-2">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 shadow-lg shadow-cyan-500/30 mb-3 text-2xl font-black text-white">⚡</div>
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">JClip AI</h1>
                <p class="text-slate-400 text-xs mt-1">Crea clips virales de hasta 60s con Inteligencia Artificial</p>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Correo Electrónico:</label>
                    <input type="email" id="emailInput" placeholder="tu@correo.com" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Contraseña:</label>
                    <input type="password" id="passwordInput" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">
                </div>
            </div>
            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-2xl text-xs transition shadow-lg shadow-cyan-900/40 mt-3">
                Entrar / Registrarse al Instante
            </button>
        </div>
        <div id="appSection" class="hidden space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="overflow-hidden pr-2">
                    <span id="userEmail" class="text-[10px] text-slate-400 font-mono truncate block"></span>
                    <div class="flex items-center gap-2">
                        <h2 class="text-base font-bold text-cyan-400">JClip Studio ⚡</h2>
                        <span id="adminBadge" class="hidden bg-amber-500/10 text-amber-400 text-[9px] font-bold px-2 py-0.5 rounded-full border border-amber-500/20">👑 ADMIN</span>
                    </div>
                </div>
                <button onclick="logout()" class="text-[11px] text-red-400 hover:text-red-300 bg-red-500/10 border border-red-500/20 px-3 py-1.5 rounded-xl transition font-medium">Salir</button>
            </div>
            <div class="bg-slate-950 border border-slate-800 p-3.5 rounded-2xl flex justify-between items-center shadow-inner">
                <span class="text-xs text-slate-300 font-medium">Créditos Disponibles:</span>
                <span id="creditsCount" class="font-black text-cyan-400 text-base">3</span>
            </div>
            <div class="space-y-1">
                <label class="block text-xs font-semibold text-slate-300 mb-1">URL de Transmisión en Vivo o Video:</label>
                <input type="text" id="streamUrl" placeholder="https://twitch.tv/... o YouTube/Kick" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">
            </div>
            <button onclick="generateClip()" class="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-3.5 rounded-2xl shadow-xl shadow-cyan-900/40 transition text-xs flex items-center justify-center gap-2">
                🎬 Generar Clip de 60s con IA (1 Crédito)
            </button>
            <div class="pt-3 border-t border-slate-800/80 space-y-2.5">
                <div class="text-center">
                    <span class="bg-indigo-500/10 text-indigo-400 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-indigo-500/20">RECARGA INSTANTÁNEA (Destino: josetntlyric@gmail.com)</span>
                    <p class="text-xs text-slate-300 font-medium mt-1.5">Pack de 50 Créditos IA ($9.99 USD)</p>
                </div>
                <div id="paypal-button-container" class="pt-1"></div>
            </div>
        </div>
    </div>
    <script>
        let currentUser = null;
        async function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if(!email || !password) { alert("Por favor ingresa tu correo y contraseña."); return; }
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    currentUser = data;
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('appSection').classList.remove('hidden');
                    document.getElementById('userEmail').innerText = data.email;
                    document.getElementById('creditsCount').innerText = data.credits;
                    if (data.isAdmin) {
                        document.getElementById('adminBadge').classList.remove('hidden');
                    } else {
                        document.getElementById('adminBadge').classList.add('hidden');
                    }
                } else {
                    alert(data.error || "Error al iniciar sesión.");
                }
            } catch (error) {
                alert("Error de conexión con el servidor.");
            }
        }
        function logout() {
            currentUser = null;
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
        }
        function generateClip() {
            const url = document.getElementById('streamUrl').value;
            if (!url) { alert("Ingresa una URL válida de video o directo."); return; }
            alert("JClip AI está procesando y recortando los mejores 60 segundos...");
        }
        paypal.Buttons({
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{ description: "Pack de 50 Créditos - JClip AI", amount: { value: '9.99' } }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    notificarPagoExitoso(details.id);
                });
            }
        }).render('#paypal-button-container');
        async function notificarPagoExitoso(orderId) {
            if (!currentUser) return;
            try {
                const response = await fetch('/api/paypal-success', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid: currentUser.uid, orderId })
                });
                const data = await response.json();
                if (data.success) {
                    currentUser.credits = data.newCredits;
                    document.getElementById('creditsCount').innerText = data.newCredits;
                    alert("¡Pago exitoso! Se han añadido 50 créditos a tu cuenta de JClip AI automáticamente.");
                }
            } catch (error) {
                alert("Error de comunicación con el servidor.");
            }
        }
    </script>
</body>
</html>
